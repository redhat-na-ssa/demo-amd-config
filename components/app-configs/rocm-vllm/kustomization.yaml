apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rocm-vllm

resources:
  - https://github.com/redhat-na-ssa/demo-amd-vllm/bases/build
  - https://github.com/redhat-na-ssa/demo-amd-vllm/bases/deploy
  - namespace.yaml
  - limitrange.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: image-registry.openshift-image-registry.svc:5000/rocm-vllm/vllm:latest
