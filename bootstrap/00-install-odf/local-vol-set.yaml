---
apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  name: local-disks
  namespace: openshift-local-storage
spec:
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: 'node-role.kubernetes.io/worker'
            operator: Exists
  deviceInclusionSpec:
    deviceTypes:
      - disk
  storageClassName: localblock
  volumeMode: Block
